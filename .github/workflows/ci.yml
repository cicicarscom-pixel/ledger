name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Check BOM
        run: bash scripts/ci/check-bom.sh
      - name: Check Names
        run: bash scripts/ci/check-names.sh
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Deno Test
        run: deno test --allow-all supabase/functions/
