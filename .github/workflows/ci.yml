name: CI
on: [push, pull_request]
jobs:
  kontroller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: BOM yok
        run: bash scripts/ci/check-bom.sh
      - name: Kök dizin haritası (STRUCTURE.md)
        run: node scripts/ci/check-root-map.mjs
      - name: Edge Functions — tanımsız isim, sözdizimi, bulunamayan modül
        run: bash scripts/ci/check-names.sh supabase/functions
        env:
          EXTRA_TSC_FLAGS: --allowImportingTsExtensions
      - name: Ledger uygulamaları — tanımsız isim, sözdizimi, bulunamayan modül
        run: bash scripts/ci/check-names.sh apps/ledger apps/admin
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Koruma testleri (WhatsApp asistanı)
        run: deno test --no-check --allow-all supabase/functions/shared/ai/guards/ResponseGuards.test.ts supabase/functions/shared/ai/AIOrchestrator.test.ts supabase/functions/shared/ai/persona/PersonaService.test.ts supabase/functions/shared/ai/flow/FlowAIGate.test.ts supabase/functions/shared/ai/flow/tools/FlowTools.test.ts supabase/functions/shared/ai/flow/CaptionService.test.ts supabase/functions/shared/infrastructure/zernio/analyticsScope.test.ts supabase/functions/shared/ai/flow/tools/SocialAnalyticsTools.test.ts supabase/functions/shared/ai/flow/tools/PublishTools.test.ts supabase/functions/shared/ai/flow/SuggestionService.test.ts supabase/functions/shared/infrastructure/zernio/analyticsMapping.test.ts
